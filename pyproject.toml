[project]
name = "adsp32021-assignment-2"
version = "0.1.0"
description = "Local MLflow, Feast, and CodeCarbon workflow for ADSP 32021 Assignment 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "codecarbon==3.3.2",
    "feast==0.67.0",
    "matplotlib>=3.8,<4",
    "mlflow==3.17.2",
    "pandas>=2.2,<3",
    "pyarrow>=17,<25",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false

[dependency-groups]
notebook = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
]
